<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IVT — Ivoire Vivrier Trading | Vivrier de gros, Côte d'Ivoire</title>
<meta name="description" content="Ivoire Vivrier Trading : fruits, légumes, féculents et herbes aromatiques en gros. Prix de marché actualisés chaque semaine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="has-ticker">

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="logo" href="index.html" aria-label="IVT — Ivoire Vivrier Trading">
      <img class="logo__img" src="assets/img/logo-ivt.png" alt="IVT"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="logo__mark" style="display:none"><span class="i">i</span><span class="v">v</span><span class="t">t</span></span>
      <span class="logo__text">Ivoire<br>Vivrier Trading</span>
    </a>
    <nav class="nav">
      <a href="index.html" aria-current="page">Accueil</a>
      <a href="boutique.html">Boutique</a>
      <a href="boutique.html#mercuriale" style="position:relative">Prix du marché<span class="pdm-badge" id="pdmBadge"></span></a>
      <a href="https://wa.me/2250585024949" target="_blank" rel="noopener">Contact</a>
    </nav>
    <div class="header-actions">
      <a class="fb-btn" href="https://www.facebook.com/IvoireVivrierTrading1" target="_blank" rel="noopener" aria-label="Facebook IVT">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M22 12.06C22 6.51 17.52 2 12 2S2 6.51 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.45h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z"/></svg>
      </a>
      <a class="cart-btn" href="panier.html" aria-label="Panier">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.6L21 8H7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        <span class="cart-count" data-cart-count style="display:none">0</span>
      </a>
      <button class="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<div class="ticker" id="tickerBar" aria-label="Cours du marché de gros">
  <div class="wrap ticker__row">
    <div class="ticker__mask">
      <div id="tickerMarche"></div>
    </div>
    <button type="button" class="ticker__toggle" aria-expanded="true" aria-controls="tickerMarche" aria-label="Replier ou déplier le bandeau de prix">
      <svg class="ticker__chevron" viewBox="0 0 24 24" width="16" height="16"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<main>

<section class="hero" data-screen-label="Accueil — Hero">
  <div class="wrap">
    <div class="hero__stage" id="heroStage"></div>
  </div>
</section>

<section class="section section--alt">
  <div class="wrap">
    <div class="section__head">
      <div>
        <p class="eyebrow eyebrow--red">Prix du marché</p>
        <h2 class="display section__title">Les plus fortes variations</h2>
        <p class="lede" style="margin-top:14px">Relevé comparé à la semaine précédente sur l'ensemble du catalogue.</p>
      </div>
      <a class="btn btn--ghost btn--sm" href="boutique.html#mercuriale">Mercuriale complète →</a>
    </div>
    <div class="grid-products" id="grilleVariations"></div>
  </div>
</section>

</main>

<script src="data/catalogue.js"></script>
<script src="assets/js/app.js"></script>
<script>
(() => {
  const A = IVT_APP;
  const D = A.DATA;
  document.getElementById('pdmBadge').textContent = A.dateCourte(D.semaines[D.semaines.length - 1]);

  const PHARES = ['tomate','ananas','piment-big-sun','avocat','gombo','banane-plantain','oignon-violet','pasteque'];
  const phares = PHARES.map(s => A.parSlug[s]).filter(Boolean);

  A.creerHero(document.getElementById('heroStage'), phares);
  A.initTickerBar(document.getElementById('tickerBar'));

  const variations = [...D.produits]
    .sort((a, b) => Math.abs(A.variation(b).pct) - Math.abs(A.variation(a).pct))
    .slice(0, 8);
  document.getElementById('grilleVariations').innerHTML = variations.map(A.carteProduit).join('');

  A.observerReveal();
})();
</script>
</body>
</html>
